[package]
name = "quicmic"
version = "0.6.7"
edition = "2021"
authors = ["crtGhoul"]
description = "Turn any device with a microphone and a web browser into a wireless PC microphone over WebTransport"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["microphone", "audio", "webtransport", "streaming", "lan"]
categories = ["multimedia::audio", "network-programming", "web-programming"]
repository = "https://github.com/crtGhoul/quicmic-zero-ui"
# Keep the published crate lean: ship only what `cargo install` needs (src/ + the
# embedded web/ assets + docs). Dev/release tooling, screenshots, AGENTS.md, and
# the lockfile are excluded from the package.
exclude = [
    "assets/",
    ".github/",
    "AGENTS.md",
    "Cargo.lock",
    "dist-workspace.toml",
    "about.toml",
    "about.hbs",
    "cliff.toml",
    ".gitignore",
]

[package.metadata.wix]
upgrade-guid = "99A5D017-94BE-4CD2-9B6D-D92E0B00E7F4"
path-guid = "1BE1861C-BA69-4079-AF05-E5FB24DD4857"
license = false
eula = false

[dependencies]
# Pure-Rust RNNoise port: speech-focused noise cancellation (Gate 5).
nnnoiseless = "0.5"
# Web framework & transport
axum = { version = "0.8", features = ["ws", "macros"] }
# `tls-rustls-no-provider` (instead of `tls-rustls`) avoids pulling in the
# aws-lc-rs crypto backend: we install the `ring` provider ourselves at startup
# (`rustls::crypto::ring::default_provider().install_default()` in main), so the
# whole tree stays ring-only — no aws-lc-sys, hence no C compiler / NASM build
# dependency.
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
wtransport = { version = "0.7.1", features = ["self-signed"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "fs",
    "net",
    "io-util",
] }

# Audio output
cpal = "0.18"

# TLS & cryptography.
# `default-features = false` drops rustls's default aws-lc-rs provider (and the
# `prefer-post-quantum` default, which also requires aws-lc-rs); we use the `ring`
# provider exclusively. `std`/`tls12`/`logging` are re-enabled because they are
# default features we still rely on.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# Outbound TLS for the startup update check (client side). `tokio-rustls` and
# `rustls-native-certs` are already in the tree (via axum-server); declaring them
# here adds no new compiled crate. `default-features = false` keeps the aws-lc-rs
# provider out — the update check uses the same process-default `ring` provider.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
ring = "0.17"
base64 = "0.22"

# Concurrency
parking_lot = "0.12"

# Networking & utilities
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8.11.0"
mime_guess = "2.0"
anyhow = "1"
http = "1"
qr2term = "0.3"
# Direct use of the QR matrix for the native GUI pairing panel (`to_colors`
# needs no extra features). Already in the lockfile via qr2term 0.3, so this
# adds no new crates to the dependency tree.
qrcode = "0.14"

# Native GUI (egui/eframe): replaces the terminal console as the default UI
# when a display is available. `--console` restores the old terminal UI.
# Pure Rust; on Linux winit loads X11/Wayland/GL at runtime via dlopen, so no
# new system build dependencies (dist-workspace.toml apt list is unchanged).
eframe = "0.36"

[target.'cfg(windows)'.dependencies]
# Raw WASAPI loopback capture for the 🔊 Speaker tab (cpal can't do loopback).
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Registry",
] }
# System-tray icon for `--tray` mode (Windows only): menu with a status line,
# a "Show connection QR" item and Quit. Pure-Rust, no native build deps.
tray-icon = "0.25"
# Opens the connection-QR page in the default browser from the tray menu.
# Windows-only use; kept out of the shared deps so other platforms are untouched.
open = "5"

[build-dependencies]
# Decodes web/icons/icon-192.png to raw RGBA at build time for the tray icon.
# Pure Rust (miniz_oxide via fdeflate) — no C compiler or system libraries, so
# Linux/macOS builds gain no system dependencies from it.
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/quicmic.ico into the .exe on Windows (build.rs, cfg(windows)).
winresource = "0.1"

[dev-dependencies]
# `tower`'s `util` feature provides `ServiceExt::oneshot`, used to drive the axum
# router in-process for the HTTP API tests (no real socket or audio device).
tower = { version = "0.5", features = ["util"] }
# Ad-hoc temp files for unit tests (token file parsing, …).
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
